      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - authenticate
        accessToken:
          type: string
          writeOnly: true
      required:
      - type
      - accessToken
    ChatAuthenticated:
      description: Server confirms membership and current sequence; replay uses REST.
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - authenticated
        guildId:
          $ref: '#/components/schemas/ID'
        userId:
          $ref: '#/components/schemas/ID'
        latestSequence:
          type: integer
          minimum: 0
      required:
      - type
      - guildId
      - userId
      - latestSequence
    ChatSend:
      description: Client frame. requestId is also its deduplication key within the guild/user.
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - message.send
        requestId:
          $ref: '#/components/schemas/ID'
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - type
      - requestId
      - content
    ChatAck:
      description: Server replies to the sender after durable persistence.
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - message.ack
        requestId:
          $ref: '#/components/schemas/ID'
        message:
          $ref: '#/components/schemas/ChatMessage'
      required:
      - type
      - requestId
      - message
    ChatCreated:
      description: Server broadcast to current guild members; deduplicate by message.id.
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - message.created
        message:
          $ref: '#/components/schemas/ChatMessage'
      required:
      - type
      - message
    ChatError:
      description: Server protocol/business error; requestId is null for handshake errors.
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - error
        requestId:
          anyOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        code:
          type: string
          enum:
          - UNAUTHENTICATED
          - FORBIDDEN
          - INVALID_MESSAGE
          - RATE_LIMITED
          - IDEMPOTENCY_CONFLICT
        message:
          type: string
      required:
      - type
      - requestId
      - code
      - message
  responses:
    Error400:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Caller lacks permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Conflicting state, version, reservation or idempotency key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Well-formed request violates a game or data rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Rate or action limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Required dependency unavailable; retry with the same key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- userBearer: []
