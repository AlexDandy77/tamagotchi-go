components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceTLS:
      type: mutualTLS
      description: Service certificate identity plus endpoint caller allowlist. A player JWT cannot authorize an
        internal command.
  schemas:
    ID:
      type: string
      format: uuid
      description: UUID string identifying an existing resource.
    Time:
      type: string
      format: date-time
      description: RFC 3339 UTC timestamp, e.g. 2026-09-09T10:00:00Z.
    URI:
      type: string
      format: uri
      pattern: ^https://
      description: HTTPS asset reference; binary assets are not embedded in JSON.
    Name:
      type: string
      minLength: 1
      maxLength: 80
    Version:
      type: integer
      minimum: 1
    Coins:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Whole currency units, within JavaScript safe-integer range.
    Type:
      type: string
      enum:
      - flame
      - nature
      - earth
      - electric
      - water
      - shadow
    Stats:
      type: object
      additionalProperties:
        type: number
    SettlementState:
      type: string
      enum:
      - pending
      - complete
      - blocked
    Error:
      description: Standard non-success JSON response. Never contains credentials.
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              $ref: '#/components/schemas/ID'
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  reason:
                    type: string
                required:
                - field
                - reason
          required:
          - code
          - message
          - requestId
          - details
      required:
      - error
    User:
      description: Private profile; returned only to its owner.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          $ref: '#/components/schemas/Name'
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum:
            - player
            - admin
        packageIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        createdAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - username
      - email
      - roles
      - packageIds
      - createdAt
    PublicUser:
      description: Profile visible to other users; excludes email and credentials.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          $ref: '#/components/schemas/Name'
      required:
      - id
      - username
    Register:
      description: Creates an account and starts package enrollment.
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[A-Za-z0-9_]+$
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        packageId:
          $ref: '#/components/schemas/ID'
      required:
      - username
      - email
      - password
      - packageId
    Login:
      description: Password is input only.
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Refresh:
      description: Opaque refresh token; rotated on refresh, revoked on logout.
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - refreshToken
    Session:
      description: Access token lifetime 900 seconds. Store refresh tokens securely; never publish in events.
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 900
          maximum: 900
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - user
    ProfileUpdate:
      description: Only editable public username.
      type: object
      additionalProperties: false
      properties:
        username:
          $ref: '#/components/schemas/Name'
      required:
      - username
    JWK:
      description: RSA public verification key; no private key fields.
      type: object
      additionalProperties: false
      properties:
        kty:
          type: string
          enum:
          - RSA
        use:
          type: string
          enum:
          - sig
        alg:
          type: string
          enum:
          - RS256
        kid:
          type: string
        n:
          type: string
        e:
          type: string
      required:
      - kty
      - use
      - alg
      - kid
      - n
      - e
    JWKS:
      description: Public signing keys for offline access-token validation.
      type: object
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
      required:
      - keys
    Enrollment:
      description: One record per user and package; pet provisioning is eventually consistent.
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        packageId:
          $ref: '#/components/schemas/ID'
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          $ref: '#/components/schemas/Time'
      required:
      - userId
      - packageId
      - version
      - createdAt
    FriendRequestInput:
      description: The sender is the authenticated user.
      type: object
      additionalProperties: false
      properties:
        recipientId:
          $ref: '#/components/schemas/ID'
      required:
      - recipientId
    FriendRequest:
      description: Only sender and recipient can view the request.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        senderId:
          $ref: '#/components/schemas/ID'
        recipientId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - cancelled
        createdAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - senderId
      - recipientId
      - status
      - createdAt
    RequestDecision:
      description: Recipient decides a pending invitation/request.
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - accept
          - decline
      required:
      - decision
    Relationship:
      description: Friends are mutual; enemies are a directed relation from userId to otherUserId.
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        otherUserId:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          enum:
          - friend
          - enemy
          - unknown
      required:
      - userId
      - otherUserId
      - kind
    Wallet:
      description: available excludes reservations; local balances are keyed by enrolled package UUID.
      type: object
      additionalProperties: false
      properties:
        globalBalance:
          $ref: '#/components/schemas/Coins'
        globalAvailable:
          $ref: '#/components/schemas/Coins'
        localBalances:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Coins'
        boosts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              boostId:
                type: string
                enum:
                - power
              quantity:
                type: integer
                minimum: 0
              available:
                type: integer
                minimum: 0
            required:
            - boostId
            - quantity
            - available
      required:
      - globalBalance
      - globalAvailable
      - localBalances
      - boosts
    ParticipantLoadout:
      description: Primary and secondary must be distinct, owned by this user, and available.
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        primaryPetId:
          $ref: '#/components/schemas/ID'
        secondaryPetId:
          $ref: '#/components/schemas/ID'
        boostIds:
          type: array
          items:
            type: string
            enum:
            - power
          maxItems: 1
          uniqueItems: true
      required:
      - userId
      - primaryPetId
      - secondaryPetId
      - boostIds
    BattleHoldInput:
      description: Battle-only command. Reserve fixed stake and selected boosts for both users atomically.
      type: object
      additionalProperties: false
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantLoadout'
          minItems: 2
          maxItems: 2
        rulesVersion:
          $ref: '#/components/schemas/Version'
      required:
      - participants
      - rulesVersion
    Hold:
      description: A durable reservation retained until explicit release or successful settlement.
      type: object
      additionalProperties: false
      properties:
        activityId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum:
          - reserved
          - released
          - settled
      required:
      - activityId
      - status
    BattleMoneyResult:
      description: User Management checks winner/loser against the reservation and computes stake transfer.
      type: object
      additionalProperties: false
      properties:
        winnerId:
          $ref: '#/components/schemas/ID'
        loserId:
          $ref: '#/components/schemas/ID'
      required:
      - winnerId
      - loserId
    WalletResult:
      description: Exactly one settlement per activity; reward amounts are server-validated.
      type: object
      additionalProperties: false
      properties:
        activityId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum:
          - complete
        balances:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              userId:
                $ref: '#/components/schemas/ID'
              balance:
                $ref: '#/components/schemas/Coins'
            required:
            - userId
            - balance
      required:
      - activityId
      - status
      - balances
    RaidMoneyInput:
      description: Raid-only command. Uses the pinned admin-created schedule; no client-chosen amount.
      type: object
      additionalProperties: false
      properties:
        scheduleId:
          $ref: '#/components/schemas/ID'
        scheduleVersion:
          $ref: '#/components/schemas/Version'
        recipientIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
      required:
      - scheduleId
      - scheduleVersion
      - recipientIds
    LocalRewardInput:
      description: Tamagotchi-only command, one grant per completed care action.
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        packageId:
          $ref: '#/components/schemas/ID'
        configVersion:
          $ref: '#/components/schemas/Version'
        actionId:
          $ref: '#/components/schemas/Name'
      required:
      - userId
      - packageId
      - configVersion
      - actionId
    LocalRewardResult:
      description: Result of one package-local currency grant.
      type: object
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/ID'
        userId:
          $ref: '#/components/schemas/ID'
        packageId:
          $ref: '#/components/schemas/ID'
        balance:
          $ref: '#/components/schemas/Coins'
      required:
      - operationId
      - userId
      - packageId
      - balance
    Pet:
      description: Persistent pet; primary assignment is separate. packageStats preserve package-specific keys and
        units.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        packageId:
          $ref: '#/components/schemas/ID'
        configVersion:
          $ref: '#/components/schemas/Version'
        ownerId:
          $ref: '#/components/schemas/ID'
        name:
          $ref: '#/components/schemas/Name'
        combatType:
          $ref: '#/components/schemas/Type'
        level:
          type: integer
          minimum: 1
          maximum: 100
        xp:
          type: integer
          minimum: 0
        spriteUrls:
          type: array
          items:
            $ref: '#/components/schemas/URI'
        packageStats:
          $ref: '#/components/schemas/Stats'
        version:
          $ref: '#/components/schemas/Version'
      required:
      - id
      - packageId
      - configVersion
      - ownerId
      - name
      - combatType
      - level
      - xp
      - spriteUrls
      - packageStats
      - version
    PetRoster:
      description: Owned pets and selected primary. All secondary entries are existing pet IDs.
      type: object
      additionalProperties: false
      properties:
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        primaryPetId:
          anyOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        secondaryPetIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          uniqueItems: true
      required:
      - pets
      - primaryPetId
      - secondaryPetIds
    PrimaryInput:
      description: Select another owned, unreserved pet.
      type: object
      additionalProperties: false
      properties:
        petId:
          $ref: '#/components/schemas/ID'
      required:
      - petId
    CareInput:
      description: Server applies configured effects, XP/currency caps and cooldown; client supplies no stat deltas.
      type: object
      additionalProperties: false
      properties:
        actionId:
          $ref: '#/components/schemas/Name'
        expectedVersion:
          $ref: '#/components/schemas/Version'
      required:
      - actionId
      - expectedVersion
    CareResult:
      description: Pet update is durable; local currency settlement may still be pending.
      type: object
      additionalProperties: false
      properties:
        actionInstanceId:
          $ref: '#/components/schemas/ID'
        pet:
          $ref: '#/components/schemas/Pet'
        localRewardStatus:
          $ref: '#/components/schemas/SettlementState'
      required:
      - actionInstanceId
      - pet
      - localRewardStatus
    StarterInput:
      description: User Management only; requires a canonical enrollment. Unique by user and package.
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        packageId:
          $ref: '#/components/schemas/ID'
      required:
      - userId
      - packageId
    TypeCatalog:
      description: Directed cycle means each type has advantage over the next one.
      type: object
      additionalProperties: false
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/Type'
          minItems: 6
          maxItems: 6
          uniqueItems: true
        advantages:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              attacker:
                $ref: '#/components/schemas/Type'
              defender:
                $ref: '#/components/schemas/Type'
              multiplier:
                type: number
                minimum: 0
            required:
            - attacker
            - defender
            - multiplier
      required:
      - types
      - advantages
    PetReserveInput:
      description: Coordinator reserves all pets atomically. Battle uses two loadouts; raid uses one primary per
        reservation.
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - battle
          - raid
        users:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              userId:
                $ref: '#/components/schemas/ID'
              primaryPetId:
                $ref: '#/components/schemas/ID'
              secondaryPetId:
                anyOf:
                - $ref: '#/components/schemas/ID'
                - type: 'null'
            required:
            - userId
            - primaryPetId
            - secondaryPetId
          minItems: 1
          maxItems: 2
      required:
      - kind
      - users
    PetReservation:
      description: Frozen combat inputs. Each returned pet includes its package configuration version.
      type: object
      additionalProperties: false
      properties:
        activityId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum:
          - reserved
          - released
          - settled
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
      required:
      - activityId
      - status
      - pets
    PetBattleResult:
      description: 'Battle-only: split XP and transfer the existing loser primary atomically, then release holds.'
      type: object
      additionalProperties: false
      properties:
        winnerId:
          $ref: '#/components/schemas/ID'
        loserId:
          $ref: '#/components/schemas/ID'
        rulesVersion:
          $ref: '#/components/schemas/Version'
      required:
      - winnerId
      - loserId
      - rulesVersion
    PetRaidResult:
      description: 'Raid-only: award the configured XP to one reserved primary, then release its hold.'
      type: object
      additionalProperties: false
      properties:
        raidId:
          $ref: '#/components/schemas/ID'
        scheduleId:
          $ref: '#/components/schemas/ID'
        scheduleVersion:
          $ref: '#/components/schemas/Version'
        rewarded:
          type: boolean
      required:
      - raidId
      - scheduleId
      - scheduleVersion
      - rewarded
    PetResult:
      description: Pet changes applied once per reservation.
      type: object
      additionalProperties: false
      properties:
        activityId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum:
          - complete
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
      required:
      - activityId
      - status
      - pets
    BattleCreate:
      description: Challenge a different user using an owned primary, an owned secondary and optional boost.
      type: object
      additionalProperties: false
      properties:
        opponentId:
          $ref: '#/components/schemas/ID'
        primaryPetId:
          $ref: '#/components/schemas/ID'
        secondaryPetId:
          $ref: '#/components/schemas/ID'
        boostIds:
          type: array
          items:
            type: string
            enum:
            - power
          maxItems: 1
          uniqueItems: true
      required:
      - opponentId
      - primaryPetId
      - secondaryPetId
      - boostIds
    BattleAccept:
      description: Recipient selects their loadout. Validation and all reservations precede active combat.
      type: object
      additionalProperties: false
      properties:
        primaryPetId:
          $ref: '#/components/schemas/ID'
        secondaryPetId:
          $ref: '#/components/schemas/ID'
        boostIds:
          type: array
          items:
            type: string
            enum:
            - power
          maxItems: 1
          uniqueItems: true
      required:
      - primaryPetId
      - secondaryPetId
      - boostIds
    BattleAction:
      description: Only the current player can attack. Forfeit is allowed for either participant while active.
      type: object
      additionalProperties: false
      properties:
        expectedTurn:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
          - attack
          - forfeit
      required:
      - expectedTurn
      - action
    Battle:
      description: Only participants may read. Currency/pet effects become final when settlement is complete.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        challengerId:
          $ref: '#/components/schemas/ID'
        opponentId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum:
          - pending
          - preparing
          - active
          - settling
          - finished
          - declined
          - cancelled
          - expired
        loadouts:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantLoadout'
          maxItems: 2
        rulesVersion:
          $ref: '#/components/schemas/Version'
        turn:
          type: integer
          minimum: 0
        currentPlayerId:
          anyOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        turnDeadline:
          anyOf:
          - $ref: '#/components/schemas/Time'
          - type: 'null'
        hp:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              userId:
                $ref: '#/components/schemas/ID'
              current:
                type: integer
                minimum: 0
              maximum:
                type: integer
                minimum: 1
            required:
            - userId
            - current
            - maximum
        winnerId:
          anyOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        loserId:
          anyOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        settlement:
          anyOf:
          - $ref: '#/components/schemas/SettlementState'
          - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Time'
        expiresAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - challengerId
      - opponentId
      - status
      - loadouts
      - rulesVersion
      - turn
      - currentPlayerId
      - turnDeadline
      - hp
      - winnerId
      - loserId
      - settlement
      - createdAt
      - expiresAt
    DeviceInput:
      description: Token is delivered only to Firebase; unique per owner/device. Never echoed.
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
        platform:
          type: string
          enum:
          - web
          - android
          - ios
        packageId:
          $ref: '#/components/schemas/ID'
      required:
      - token
      - platform
      - packageId
    Device:
      description: Safe push-registration response.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        packageId:
          $ref: '#/components/schemas/ID'
        platform:
          type: string
          enum:
          - web
          - android
          - ios
        updatedAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - packageId
      - platform
      - updatedAt
    Notification:
      description: Durable notification generated from a domain event.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        eventId:
          $ref: '#/components/schemas/ID'
        type:
          type: string
        title:
          type: string
        body:
          type: string
        targetId:
          $ref: '#/components/schemas/ID'
        createdAt:
          $ref: '#/components/schemas/Time'
        readAt:
          anyOf:
          - $ref: '#/components/schemas/Time'
          - type: 'null'
      required:
      - id
      - eventId
      - type
      - title
      - body
      - targetId
      - createdAt
      - readAt
    LocationInput:
      description: Measured coordinates from the current client; older timestamps are ignored.
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
        recordedAt:
          $ref: '#/components/schemas/Time'
      required:
      - latitude
      - longitude
      - accuracyMeters
      - recordedAt
    LocationResult:
      description: An ignored stale update does not replace the stored location.
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        latest:
          $ref: '#/components/schemas/LocationInput'
      required:
      - accepted
      - latest
    MapEntry:
      description: Friends/enemies stay listed even with missing or stale location. Only fresh nearby strangers
        appear.
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        relationship:
          type: string
          enum:
          - friend
          - enemy
          - unknown
        location:
          anyOf:
          - $ref: '#/components/schemas/LocationInput'
          - type: 'null'
        distanceMeters:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        stale:
          type: boolean
      required:
      - user
      - relationship
      - location
      - distanceMeters
      - stale
    GuildInput:
      description: Guild name and description.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
          maxLength: 1000
      required:
      - name
      - description
    Guild:
      description: Guild leader is also a member; exactly one leader per guild.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        leaderId:
          $ref: '#/components/schemas/ID'
        memberCount:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - name
      - description
      - leaderId
      - memberCount
      - createdAt
    Member:
      description: Guild-local role, independent of global privileges.
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        role:
          type: string
          enum:
          - leader
          - officer
          - member
        joinedAt:
          $ref: '#/components/schemas/Time'
      required:
      - userId
      - role
      - joinedAt
    RoleInput:
      description: Leader-only; use the leadership endpoint to change leader.
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - officer
          - member
      required:
      - role
    LeaderInput:
      description: Transfer leadership to an existing member.
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/ID'
      required:
      - userId
    GuildInvite:
      description: Only guild officers/leader and the invited user may read.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        guildId:
          $ref: '#/components/schemas/ID'
        inviterId:
          $ref: '#/components/schemas/ID'
        recipientId:
          $ref: '#/components/schemas/ID'
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - revoked
        createdAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - guildId
      - inviterId
      - recipientId
      - status
      - createdAt
    Eligibility:
      description: Guild authority response. eligible is false for a non-member.
      type: object
      additionalProperties: false
      properties:
        guildId:
          $ref: '#/components/schemas/ID'
        userId:
          $ref: '#/components/schemas/ID'
        eligible:
          type: boolean
        role:
          anyOf:
          - type: string
            enum:
            - leader
            - officer
            - member
          - type: 'null'
      required:
      - guildId
      - userId
      - eligible
      - role
    ChatMessage:
      description: Sequence is monotonically increasing within a guild.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        guildId:
          $ref: '#/components/schemas/ID'
        authorId:
          $ref: '#/components/schemas/ID'
        sequence:
          type: integer
          minimum: 1
        content:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - guildId
      - authorId
      - sequence
      - content
      - createdAt
    ChatHistory:
      description: Replay messages after a known sequence; hasMore controls continuation.
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        hasMore:
          type: boolean
      required:
      - items
      - hasMore
    PackageInput:
      description: Admin registers a participating app. Moderator assignments are separate.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        appVersion:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 2000
      required:
      - name
      - appVersion
      - description
    Package:
      description: Package metadata; configVersion identifies immutable game rules, independently of appVersion.
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          $ref: '#/components/schemas/Name'
        appVersion:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - draft
          - active
          - suspended
        configVersion:
          anyOf:
          - $ref: '#/components/schemas/Version'
          - type: 'null'
        moderatorIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
        version:
          $ref: '#/components/schemas/Version'
      required:
      - id
      - name
      - appVersion
      - description
      - status
      - configVersion
      - moderatorIds
      - version
    PackageUpdate:
      description: Admin controls status; moderators may edit name, description and appVersion for their package.
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        name:
          $ref: '#/components/schemas/Name'
        appVersion:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
          - draft
          - active
          - suspended
      required:
      - expectedVersion
    BonusRule:
      description: Package-defined interpretation; aggregate care bonus is capped by global combat rules.
      type: object
      additionalProperties: false
      properties:
        threshold:
          type: number
        direction:
          type: string
          enum:
          - gte
          - lte
        percent:
          type: number
          minimum: 0
          maximum: 10
      required:
      - threshold
      - direction
      - percent
    StatDefinition:
      description: Values are package-local; min <= initial <= max. changePerMinute is applied using server elapsed
        time.
      type: object
      additionalProperties: false
      properties:
        minimum:
          type: number
        maximum:
          type: number
        initial:
          type: number
        changePerMinute:
          type: number
        bonus:
          anyOf:
          - $ref: '#/components/schemas/BonusRule'
          - type: 'null'
      required:
      - minimum
      - maximum
      - initial
      - changePerMinute
      - bonus
    CareDefinition:
      description: Server-selected effects for an action. Currency grants and XP are subject to global caps.
      type: object
      additionalProperties: false
      properties:
        statChanges:
          $ref: '#/components/schemas/Stats'
        cooldownSeconds:
          type: integer
          minimum: 1
        xp:
          type: integer
          minimum: 0
          maximum: 10
        localCurrency:
          $ref: '#/components/schemas/Coins'
      required:
      - statChanges
      - cooldownSeconds
      - xp
      - localCurrency
    PackageConfigInput:
      description: Publish a new immutable revision. First publication expects version 0; later publications expect
        the current revision.
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        starter:
          type: object
          additionalProperties: false
          properties:
            name:
              $ref: '#/components/schemas/Name'
            combatType:
              $ref: '#/components/schemas/Type'
            spriteUrls:
              type: array
              items:
                $ref: '#/components/schemas/URI'
              minItems: 1
          required:
          - name
          - combatType
          - spriteUrls
        statistics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StatDefinition'
        careActions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CareDefinition'
        localCurrencyName:
          $ref: '#/components/schemas/Name'
      required:
      - expectedVersion
      - starter
      - statistics
      - careActions
      - localCurrencyName
    PackageConfig:
      description: Immutable snapshot. Existing pets keep their creation version; migrations require a future explicit
        contract.
      type: object
      additionalProperties: false
      properties:
        packageId:
          $ref: '#/components/schemas/ID'
        version:
          $ref: '#/components/schemas/Version'
        starter:
          type: object
          additionalProperties: false
          properties:
            name:
              $ref: '#/components/schemas/Name'
            combatType:
              $ref: '#/components/schemas/Type'
            spriteUrls:
              type: array
              items:
                $ref: '#/components/schemas/URI'
              minItems: 1
          required:
          - name
          - combatType
          - spriteUrls
        statistics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StatDefinition'
        careActions:
          type: object
          additionalProperties:
