openapi: 3.1.1
info:
  title: Tamagotchi Go communication contract
  version: 1.0.0
  description: Lab 0 proposed API contract, not an implemented backend. Paths are relative to the owning service
    origin; this document does not require a gateway.
tags:
- name: User Management
- name: Tamagotchi
- name: Battle
- name: Notification
- name: Map
- name: Monster Raid
- name: Guild
- name: Package Registry
paths:
  /v1/auth/register:
    post:
      tags:
      - User Management
      summary: Register a user and enroll in a package
      operationId: POST_v1_auth_register
      description: Validate an active package; create account/enrollment atomically. Grant one initial power boost
        per account. Publish enrollment for Registry and starter provisioning. New accounts have zero currency and
        must earn a raid reward before staking a PvP battle.
      x-audience: public
      responses:
        '201':
          description: Register a user and enroll in a package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      security: []
  /v1/auth/login:
    post:
      tags:
      - User Management
      summary: Create a session
      operationId: POST_v1_auth_login
      description: Create a session
      x-audience: public
      responses:
        '200':
          description: Create a session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /v1/auth/refresh:
    post:
      tags:
      - User Management
      summary: Rotate the refresh token
      operationId: POST_v1_auth_refresh
      description: Rotate the refresh token
      x-audience: public
      responses:
        '200':
          description: Rotate the refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
      security: []
  /v1/auth/logout:
    post:
      tags:
      - User Management
      summary: Revoke the refresh session
      operationId: POST_v1_auth_logout
      description: Revoke the refresh session
      x-audience: public
      responses:
        '204':
          description: Success; no response body.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
      security: []
  /.well-known/jwks.json:
    get:
      tags:
      - User Management
      summary: Read public token verification keys
      operationId: GET_well_known_jwks_json
      description: Read public token verification keys
      x-audience: public
      responses:
        '200':
          description: Read public token verification keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /v1/users/me:
    get:
      tags:
      - User Management
      summary: Read your private profile
      operationId: GET_v1_users_me
      description: Read your private profile
      x-audience: player
      responses:
        '200':
          description: Read your private profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      tags:
      - User Management
      summary: Update your public username
      operationId: PATCH_v1_users_me
      description: Update your public username
      x-audience: player
      responses:
        '200':
          description: Update your public username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
  /v1/users/{userId}:
    get:
      tags:
      - User Management
      summary: Read a public user profile
      operationId: GET_v1_users_userId
      description: Read a public user profile
      x-audience: player
      responses:
        '200':
          description: Read a public user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
  /v1/users/me/packages/{packageId}:
    put:
      tags:
      - User Management
      summary: Enroll in an active package
      operationId: PUT_v1_users_me_packages_packageId
      description: Unique user/package pair. Publishes user.package-registered.v1 for Registry and Tamagotchi. Repeated
        enrollment does not create another starter.
      x-audience: player
      responses:
        '200':
          description: Enroll in an active package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: packageId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
  /v1/friend-requests:
    post:
      tags:
      - User Management
      summary: Send a friend request
      operationId: POST_v1_friend_requests
      description: Send a friend request
      x-audience: player
      responses:
        '201':
          description: Send a friend request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestInput'
    get:
      tags:
      - User Management
      summary: List your sent and received requests
      operationId: GET_v1_friend_requests
      description: List your sent and received requests
      x-audience: player
      responses:
        '200':
          description: List your sent and received requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /v1/friend-requests/{requestId}/decision:
    put:
      tags:
      - User Management
      summary: Accept or decline a request
      operationId: PUT_v1_friend_requests_requestId_decision
      description: Only the recipient may decide. Acceptance creates mutual friendship atomically and removes enemy
        markers for this pair.
      x-audience: player
      responses:
        '200':
          description: Accept or decline a request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDecision'
  /v1/friend-requests/{requestId}:
    delete:
      tags:
      - User Management
      summary: Cancel your pending friend request
      operationId: DELETE_v1_friend_requests_requestId
      description: Sender only; atomically changes pending to cancelled.
      x-audience: player
      responses:
        '204':
          description: Success; no response body.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
  /v1/friends/{userId}:
    delete:
      tags:
      - User Management
      summary: Remove a mutual friendship
      operationId: DELETE_v1_friends_userId
      description: Remove a mutual friendship
      x-audience: player
      responses:
        '204':
          description: Success; no response body.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
  /v1/relationships:
    get:
      tags:
      - User Management
      summary: List your friends and enemies
      operationId: GET_v1_relationships
      description: List your friends and enemies
      x-audience: player
      responses:
        '200':
          description: List your friends and enemies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /v1/enemies/{userId}:
    put:
      tags:
      - User Management
      summary: Mark a user as an enemy
      operationId: PUT_v1_enemies_userId
      description: Directed enemy relationship; removes an existing mutual friendship atomically. Self-relations
        are rejected.
      x-audience: player
      responses:
        '200':
          description: Mark a user as an enemy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
    delete:
      tags:
      - User Management
      summary: Remove your enemy marker
      operationId: DELETE_v1_enemies_userId
      description: Remove your enemy marker
      x-audience: player
      responses:
        '204':
          description: Success; no response body.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: Stable key for retries of this logical mutation. Reuse with changed input returns 409.
  /v1/wallet:
    get:
      tags:
      - User Management
      summary: Read your currencies and available boosts
      operationId: GET_v1_wallet
      description: Read your currencies and available boosts
      x-audience: player
      responses:
        '200':
          description: Read your currencies and available boosts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /internal/v1/relationships:
    get:
      tags:
      - User Management
      summary: Read a relationship for another service
      operationId: GET_internal_v1_relationships
      description: Read a relationship for another service
      x-audience: internal
      responses:
        '200':
          description: Read a relationship for another service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: otherUserId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      security:
      - serviceTLS: []
      x-allowed-callers:
      - map
      - guild
      - battle
  /internal/v1/users/{userId}/relationships:
    get:
      tags:
      - User Management
      summary: List user relationships for map visibility
      operationId: GET_internal_v1_users_userId_relationships
      description: List user relationships for map visibility
      x-audience: internal
      responses:
        '200':
          description: List user relationships for map visibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security:
      - serviceTLS: []
      x-allowed-callers:
      - map
  /internal/v1/users/{userId}/packages/{packageId}:
    get:
      tags:
      - User Management
      summary: Verify canonical package enrollment
      operationId: GET_internal_v1_users_userId_packages_packageId
      description: Verify canonical package enrollment
      x-audience: internal
      responses:
        '200':
          description: Verify canonical package enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: packageId
