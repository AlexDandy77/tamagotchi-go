# Optional local-only access to Tamagotchi's internal mTLS listener for Postman.
# Use with: docker compose -f compose.yaml -f compose.postman.internal.yaml up -d tamagotchi
services:
  tamagotchi:
    ports:
      - "127.0.0.1:18443:8443"
      - "127.0.0.1:18444:8443"
      - "127.0.0.1:18445:8443"
