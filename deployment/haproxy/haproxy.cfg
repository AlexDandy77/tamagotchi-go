# Lab 5 (contracts/replication.md): one stable address for the PostgreSQL cluster.
#   postgres:5432           the current primary (Patroni answers 200 on :8008/primary only there)
#   postgres-replicas:5433  the replicas, round-robin (read-only; used by the ETL)
#   localhost:7000          statistics page: which node is primary right now
global
  maxconn 1000

# Docker's DNS: a stopped node has no address, so it waits in maintenance instead of
# blocking HAProxy's start.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold nx 2s

defaults
  mode tcp
  retries 3
  option redispatch
  timeout connect 2s
  timeout queue 5s
  timeout client 30m
  timeout server 30m
  timeout check 2s
  # A stopped container vanishes without a TCP reset; keepalives find such half-open sessions.
  option srvtcpka
  srvtcpka-idle 5s
  srvtcpka-intvl 2s
  srvtcpka-cnt 3
  # Close every session to a node that stops being primary, so nothing keeps writing to it.
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none

listen stats
  mode http
  bind *:7000
  stats enable
  stats uri /
  stats refresh 2s

# Healthy only while a primary is reachable; the container healthcheck asks this.
frontend health
  mode http
  bind 127.0.0.1:8404
  monitor-uri /healthz
  monitor fail if { nbsrv(postgres-primary) lt 1 }

listen postgres-primary
  bind *:5432
  option httpchk GET /primary
  http-check expect status 200
  server postgres-1 postgres-1:5432 check port 8008
  server postgres-2 postgres-2:5432 check port 8008
  server postgres-3 postgres-3:5432 check port 8008

# Reads that tolerate a little lag go to the replicas; when no replica is healthy they go to
# the primary instead, so the ETL keeps working (contracts/replication.md).
frontend replicas-in
  bind *:5433
  use_backend postgres-replicas if { nbsrv(postgres-replicas) gt 0 }
  default_backend postgres-primary-reads

backend postgres-replicas
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  server postgres-1 postgres-1:5432 check port 8008
  server postgres-2 postgres-2:5432 check port 8008
  server postgres-3 postgres-3:5432 check port 8008

backend postgres-primary-reads
  option httpchk GET /primary
  http-check expect status 200
  server postgres-1 postgres-1:5432 check port 8008
  server postgres-2 postgres-2:5432 check port 8008
  server postgres-3 postgres-3:5432 check port 8008
