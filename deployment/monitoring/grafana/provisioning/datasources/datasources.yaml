apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  # Lab 5 (contracts/data-warehouse.md): the analytics star schema filled by the ETL.
  - name: Warehouse
    uid: warehouse
    type: grafana-postgresql-datasource
    access: proxy
    url: warehouse:5432
    # Anonymous viewers can send this data source SQL, so it logs in read-only, never as postgres.
    user: grafana_reader
    jsonData:
      database: warehouse
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $WAREHOUSE_READER_PASSWORD
