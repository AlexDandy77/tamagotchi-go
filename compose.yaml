name: tamagotchi-lab1
services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/lab.py setup}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.0.1
    environment:
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/lab-jaas.conf
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD}" user_broker="${KAFKA_BROKER_PASSWORD}" user_admin="${KAFKA_ADMIN_PASSWORD}" user_users="${KAFKA_USERS_PASSWORD}" user_battles="${KAFKA_BATTLES_PASSWORD}";'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:broker;User:admin;User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./deployment/kafka-jaas.conf:/etc/kafka/lab-jaas.conf:ro
      - ./.secrets/kafka-admin.properties:/run/secrets/kafka-admin.properties:ro
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka-admin.properties --list >/dev/null]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  user-management:
    image: ${USER_MANAGEMENT_IMAGE:?Set a published User Management image tag}
    environment:
      DATABASE_URL: postgres://users:${USERS_DB_PASSWORD:?Run setup}@postgres:5432/users?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: users
      KAFKA_PASSWORD: ${KAFKA_USERS_PASSWORD}
      DEPENDENCY_MODE: mock
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt.pem
      SEED_PASSWORD: ${SEED_PASSWORD:?Run setup}
    volumes:
      - ./.secrets/jwt.pem:/run/secrets/jwt.pem:ro
    ports: [127.0.0.1:8081:8080]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD, /service, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  battle:
    image: ${BATTLE_IMAGE:?Set a published Battle image tag}
    environment:
      DATABASE_URL: postgres://battles:${BATTLES_DB_PASSWORD:?Run setup}@postgres:5432/battles?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: battles
      KAFKA_PASSWORD: ${KAFKA_BATTLES_PASSWORD}
      DEPENDENCY_MODE: mock
      JWKS_URL: http://user-management:8080/.well-known/jwks.json
      MOCK_FAIL_OPERATION: ${MOCK_FAIL_OPERATION:-}
    ports: [127.0.0.1:8082:8080]
    depends_on:
      user-management: {condition: service_healthy}
    healthcheck:
      test: [CMD, /service, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
  kafka-data:
