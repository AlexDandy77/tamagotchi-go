name: tamagotchi-lab1
services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/lab.py setup}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.0.1
    environment:
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/lab-jaas.conf
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="${KAFKA_BROKER_PASSWORD}" user_broker="${KAFKA_BROKER_PASSWORD}" user_admin="${KAFKA_ADMIN_PASSWORD}" user_users="${KAFKA_USERS_PASSWORD}" user_battles="${KAFKA_BATTLES_PASSWORD}" user_guilds="${KAFKA_GUILDS_PASSWORD}" user_registry="${KAFKA_REGISTRY_PASSWORD}";'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:broker;User:admin;User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./deployment/kafka-jaas.conf:/etc/kafka/lab-jaas.conf:ro
      - ./.secrets/kafka-admin.properties:/run/secrets/kafka-admin.properties:ro
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /run/secrets/kafka-admin.properties --list >/dev/null]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    # mongod requires an owner-only keyfile; copy the bind-mounted key before starting.
    entrypoint: [bash, -c, 'install -m 400 -o mongodb -g mongodb /run/secrets/mongo-keyfile /data/configdb/keyfile && exec docker-entrypoint.sh "$$@"', --]
    command: [mongod, --replSet, rs0, --keyFile, /data/configdb/keyfile, --bind_ip_all]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run python3 scripts/lab.py setup}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:?Run setup}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./.secrets/mongo-keyfile:/run/secrets/mongo-keyfile:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  user-management:
    image: ${USER_MANAGEMENT_IMAGE:?Set a published User Management image tag}
    environment:
      DATABASE_URL: postgres://users:${USERS_DB_PASSWORD:?Run setup}@postgres:5432/users?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: users
      KAFKA_PASSWORD: ${KAFKA_USERS_PASSWORD}
      DEPENDENCY_MODE: mock
      SERVICE_TLS_CERT_FILE: /run/tls/user-management.pem
      SERVICE_TLS_KEY_FILE: /run/tls/user-management-key.pem
      SERVICE_TLS_CA_FILE: /run/tls/ca.pem
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt.pem
      SEED_PASSWORD: ${SEED_PASSWORD:?Run setup}
    volumes:
      - ./.secrets/jwt.pem:/run/secrets/jwt.pem:ro
      - ./.secrets/tls/ca.pem:/run/tls/ca.pem:ro
      - ./.secrets/tls/user-management.pem:/run/tls/user-management.pem:ro
      - ./.secrets/tls/user-management-key.pem:/run/tls/user-management-key.pem:ro
    ports: [127.0.0.1:8081:8080]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD, /service, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  battle:
    image: ${BATTLE_IMAGE:?Set a published Battle image tag}
    environment:
      DATABASE_URL: postgres://battles:${BATTLES_DB_PASSWORD:?Run setup}@postgres:5432/battles?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: battles
      KAFKA_PASSWORD: ${KAFKA_BATTLES_PASSWORD}
      DEPENDENCY_MODE: paired
      SERVICE_TLS_CERT_FILE: /run/tls/battle.pem
      SERVICE_TLS_KEY_FILE: /run/tls/battle-key.pem
      SERVICE_TLS_CA_FILE: /run/tls/ca.pem
      USER_MANAGEMENT_INTERNAL_URL: https://user-management:8443
      JWKS_URL: http://user-management:8080/.well-known/jwks.json
      MOCK_FAIL_OPERATION: ${MOCK_FAIL_OPERATION:-}
    volumes:
      - ./.secrets/tls/ca.pem:/run/tls/ca.pem:ro
      - ./.secrets/tls/battle.pem:/run/tls/battle.pem:ro
      - ./.secrets/tls/battle-key.pem:/run/tls/battle-key.pem:ro
    ports: [127.0.0.1:8082:8080]
    depends_on:
      user-management: {condition: service_healthy}
    healthcheck:
      test: [CMD, /service, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  guild:
    image: ${GUILD_IMAGE:?Set a published Guild image tag}
    environment:
      DATABASE_URL: postgres://guilds:${GUILDS_DB_PASSWORD:?Run setup}@postgres:5432/guilds?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: guilds
      KAFKA_PASSWORD: ${KAFKA_GUILDS_PASSWORD}
      DEPENDENCY_MODE: live
      JWKS_URL: http://user-management:8080/.well-known/jwks.json
      USER_MANAGEMENT_INTERNAL_URL: https://user-management:8443
      SERVICE_TLS_CERT_FILE: /run/tls/guild.pem
      SERVICE_TLS_KEY_FILE: /run/tls/guild-key.pem
      SERVICE_TLS_CA_FILE: /run/tls/ca.pem
    volumes:
      - ./.secrets/tls/ca.pem:/run/tls/ca.pem:ro
      - ./.secrets/tls/guild.pem:/run/tls/guild.pem:ro
      - ./.secrets/tls/guild-key.pem:/run/tls/guild-key.pem:ro
    ports: [127.0.0.1:8087:8080]
    depends_on:
      user-management: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, dist/main.js, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  package-registry:
    image: ${PACKAGE_REGISTRY_IMAGE:?Set a published Package Registry image tag}
    environment:
      MONGODB_URL: mongodb://registry:${REGISTRY_DB_PASSWORD:?Run setup}@mongo:27017/registry?replicaSet=rs0&authSource=registry
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: registry
      KAFKA_PASSWORD: ${KAFKA_REGISTRY_PASSWORD}
      # Monster Raid is not deployed yet; raid commands go to an explicit fixture.
      DEPENDENCY_MODE: mock
      JWKS_URL: http://user-management:8080/.well-known/jwks.json
      REGISTRY_ADMIN_USER_IDS: ${REGISTRY_ADMIN_USER_IDS:-}
      SERVICE_TLS_CERT_FILE: /run/tls/package-registry.pem
      SERVICE_TLS_KEY_FILE: /run/tls/package-registry-key.pem
      SERVICE_TLS_CA_FILE: /run/tls/ca.pem
    volumes:
      - ./.secrets/tls/ca.pem:/run/tls/ca.pem:ro
      - ./.secrets/tls/package-registry.pem:/run/tls/package-registry.pem:ro
      - ./.secrets/tls/package-registry-key.pem:/run/tls/package-registry-key.pem:ro
    ports: [127.0.0.1:8088:8080]
    depends_on:
      mongo: {condition: service_healthy}
      kafka: {condition: service_healthy}
      user-management: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, dist/main.js, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  map:
    image: ${MAP_IMAGE:?Set a published Map image tag}
    environment:
      DATABASE_URL: postgres://locations:${LOCATIONS_DB_PASSWORD:?Run setup}@postgres:5432/locations?sslmode=disable
      DEPENDENCY_MODE: live
      JWKS_URL: http://user-management:8080/.well-known/jwks.json
      USER_MANAGEMENT_URL: http://user-management:8080
      USER_MANAGEMENT_INTERNAL_URL: https://user-management:8443
      SERVICE_TLS_CERT_FILE: /run/tls/map.pem
      SERVICE_TLS_KEY_FILE: /run/tls/map-key.pem
      SERVICE_TLS_CA_FILE: /run/tls/ca.pem
    volumes:
      - ./.secrets/tls/ca.pem:/run/tls/ca.pem:ro
      - ./.secrets/tls/map.pem:/run/tls/map.pem:ro
      - ./.secrets/tls/map-key.pem:/run/tls/map-key.pem:ro
    ports: [127.0.0.1:8083:8080]
    depends_on:
      postgres: {condition: service_healthy}
      user-management: {condition: service_healthy}
    healthcheck:
      test: [CMD, /service, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
  kafka-data:
  mongo-data:
  mongo-config:
